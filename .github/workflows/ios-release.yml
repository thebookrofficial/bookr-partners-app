name: iOS Build & Release

on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: "Upload to TestFlight / App Store Connect"
        required: true
        type: boolean
        default: true

jobs:
  build-release:
    name: Build & Sign iOS (.ipa)
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16.1+
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app || sudo xcode-select -s /Applications/Xcode_16.1.app
          xcodebuild -version

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile

      - name: Download Skia Native Binaries
        run: npx install-skia

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      # --- CONFIGURE APP STORE CONNECT API KEY ---
      - name: Setup App Store Connect API Key
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          python3 -c "
          import os, base64

          content = os.environ.get('ASC_KEY_BASE64', '').strip()
          key_id = ''.join(os.environ.get('ASC_KEY_ID', '').split())

          if not content or not key_id:
              raise SystemExit('Error: Missing APP_STORE_CONNECT_API_KEY_BASE64 or APP_STORE_CONNECT_API_KEY_ID secret')

          key_bytes = None
          if '-----BEGIN' in content:
              key_bytes = content.encode('utf-8')
          else:
              try:
                  decoded = base64.b64decode(''.join(content.split()))
                  if b'-----BEGIN' in decoded:
                      key_bytes = decoded
                  else:
                      try:
                          decoded2 = base64.b64decode(''.join(decoded.decode('utf-8', errors='ignore').split()))
                          if b'-----BEGIN' in decoded2:
                              key_bytes = decoded2
                          else:
                              key_bytes = decoded
                      except Exception:
                          key_bytes = decoded
              except Exception as e:
                  raise SystemExit(f'Failed to decode base64: {e}')

          if not key_bytes or b'PRIVATE KEY' not in key_bytes:
              preview = key_bytes[:30] if key_bytes else b'None'
              raise SystemExit(f'ERROR: APP_STORE_CONNECT_API_KEY_BASE64 does not contain a valid AuthKey_*.p8 PEM private key! Content header received: {preview}')

          for d in [os.path.expanduser('~/.appstoreconnect/private_keys'), os.path.expanduser('~/.private_keys')]:
              os.makedirs(d, exist_ok=True)
              target_file = os.path.join(d, f'AuthKey_{key_id}.p8')
              with open(target_file, 'wb') as f:
                  f.write(key_bytes.strip() + b'\n')
              os.chmod(target_file, 0o600)
              print(f'Wrote {target_file} ({len(key_bytes)} bytes)')
          "

      # --- CLEAN UP ORPHANED DEVELOPMENT CERTIFICATES ---
      - name: Clean up Orphaned Development Certificates
        continue-on-error: true
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          python3 -m venv $RUNNER_TEMP/asc_venv
          $RUNNER_TEMP/asc_venv/bin/pip install --quiet pyjwt cryptography requests
          $RUNNER_TEMP/asc_venv/bin/python -c "
          import os, time, jwt, requests

          key_id = ''.join(os.environ.get('ASC_KEY_ID', '').split())
          issuer_id = ''.join(os.environ.get('ASC_ISSUER_ID', '').split())
          key_path = os.path.expanduser(f'~/.appstoreconnect/private_keys/AuthKey_{key_id}.p8')

          if not os.path.exists(key_path):
              print(f'Key file {key_path} not found, skipping cleanup')
              exit(0)

          with open(key_path, 'r') as f:
              private_key = f.read()

          token = jwt.encode(
              {
                  'iss': issuer_id,
                  'exp': int(time.time()) + 1200,
                  'aud': 'appstoreconnect-v1'
              },
              private_key,
              algorithm='ES256',
              headers={'kid': key_id}
          )

          headers = {'Authorization': f'Bearer {token}'}

          try:
              url = 'https://api.appstoreconnect.apple.com/v1/certificates?filter[certificateType]=DEVELOPMENT,IOS_DEVELOPMENT'
              res = requests.get(url, headers=headers)
              if res.status_code == 200:
                  certs = res.json().get('data', [])
                  print(f'Found {len(certs)} existing development certificates')
                  for cert in certs:
                      cert_id = cert['id']
                      display_name = cert.get('attributes', {}).get('displayName', cert_id)
                      print(f'Revoking orphaned development certificate: {display_name} ({cert_id})')
                      del_res = requests.delete(f'https://api.appstoreconnect.apple.com/v1/certificates/{cert_id}', headers=headers)
                      print(f'  Revoke status: {del_res.status_code}')
              else:
                  print(f'Could not fetch certificates (status {res.status_code}): {res.text}')
          except Exception as e:
              print(f'Warning: Certificate cleanup encountered an error: {e}')
          "

      # --- BUILD EXPORT ARCHIVE (AUTOMATIC SIGNING VIA API KEY) ---
      - name: Build Archive
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          SENTRY_DISABLE_AUTO_UPLOAD: true
        run: |
          KEY_ID=$(echo -n "$ASC_KEY_ID" | tr -d '[:space:]')
          ISSUER_ID=$(echo -n "$ASC_ISSUER_ID" | tr -d '[:space:]')
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"

          echo "Using key path: $KEY_PATH (exists: $(test -f "$KEY_PATH" && echo yes || echo no))"

          xcodebuild archive \
            -workspace ios/BookrBusinessApp.xcworkspace \
            -scheme BookrBusinessApp \
            -configuration Release \
            -archivePath $RUNNER_TEMP/BookrBusinessApp.xcarchive \
            -destination "generic/platform=iOS" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            CODE_SIGN_STYLE="Automatic" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID || '3K7597D25X' }}"

      - name: Create ExportOptions.plist
        run: |
          cat <<EOF > $RUNNER_TEMP/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>${{ secrets.APPLE_TEAM_ID || '3K7597D25X' }}</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>uploadBitcode</key>
              <false/>
          </dict>
          </plist>
          EOF

      - name: Export .ipa
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          KEY_ID=$(echo -n "$ASC_KEY_ID" | tr -d '[:space:]')
          ISSUER_ID=$(echo -n "$ASC_ISSUER_ID" | tr -d '[:space:]')
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"

          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/BookrBusinessApp.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/build_output \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      # --- ARTIFACT UPLOAD ---
      - name: Upload .ipa as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BookrBusinessApp-iOS
          path: ${{ runner.temp }}/build_output/*.ipa

      # --- UPLOAD TO TESTFLIGHT / APP STORE CONNECT ---
      - name: Upload to App Store Connect
        if: ${{ inputs.upload_to_testflight }}
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          IPA_PATH=$(find $RUNNER_TEMP/build_output -name "*.ipa" | head -n 1)
          echo "Uploading $IPA_PATH to App Store Connect..."

          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"
