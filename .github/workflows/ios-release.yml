name: iOS Release Pipeline

on:
  workflow_dispatch:
    inputs:
      upload_to_app_store:
        description: "Upload to TestFlight / App Store Connect"
        required: true
        type: boolean
        default: true
  push:
    tags:
      - "v*.*.*"

jobs:
  release-ios:
    name: Build & Upload iOS App
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Skia Native Binaries
        run: npx install-skia

      # --- CONFIGURE APP STORE CONNECT API KEY ---
      - name: Setup App Store Connect API Key
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          python3 -c "
          import os, base64

          content = os.environ.get('ASC_KEY_BASE64', '').strip()
          key_id = ''.join(os.environ.get('ASC_KEY_ID', '').split())

          if not content or not key_id:
              raise SystemExit('Error: Missing APP_STORE_CONNECT_API_KEY_BASE64 or APP_STORE_CONNECT_API_KEY_ID secret')

          key_bytes = None
          if '-----BEGIN' in content:
              key_bytes = content.encode('utf-8')
          else:
              try:
                  decoded = base64.b64decode(''.join(content.split()))
                  if b'-----BEGIN' in decoded:
                      key_bytes = decoded
                  else:
                      try:
                          decoded2 = base64.b64decode(''.join(decoded.decode('utf-8', errors='ignore').split()))
                          if b'-----BEGIN' in decoded2:
                              key_bytes = decoded2
                          else:
                              key_bytes = decoded
                      except Exception:
                          key_bytes = decoded
              except Exception as e:
                  raise SystemExit(f'Failed to decode base64: {e}')

          if not key_bytes or b'PRIVATE KEY' not in key_bytes:
              preview = key_bytes[:30] if key_bytes else b'None'
              raise SystemExit(f'ERROR: APP_STORE_CONNECT_API_KEY_BASE64 does not contain a valid AuthKey_*.p8 PEM private key! Content header received: {preview}')

          for d in [os.path.expanduser('~/.appstoreconnect/private_keys'), os.path.expanduser('~/.private_keys')]:
              os.makedirs(d, exist_ok=True)
              target_file = os.path.join(d, f'AuthKey_{key_id}.p8')
              with open(target_file, 'wb') as f:
                  f.write(key_bytes.strip() + b'\n')
              os.chmod(target_file, 0o600)
              print(f'Wrote {target_file} ({len(key_bytes)} bytes)')
          "

      # --- INSTALL SIGNING CERTIFICATE & PROVISIONING PROFILE ---
      - name: Install Apple Certificate & Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'temporary_github_keychain_pass' }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # Decode certificate and provisioning profile
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import certificate to keychain
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Install Provisioning Profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

      # --- CACHING & IOS DEPENDENCIES ---
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install CocoaPods
        run: |
          cd ios
          sed -i '' "s/source 'https:\/\/cdn.cocoapods.org\/'/source 'https:\/\/github.com\/CocoaPods\/Specs.git'/g" Podfile
          pod install --repo-update

      # --- CREATE EXPORT OPTIONS PLIST ---
      - name: Create ExportOptions.plist
        run: |
          cat << 'EOF' > ios/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>destination</key>
              <string>export</string>
              <key>method</key>
              <string>app-store</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>teamID</key>
              <string>3K7597D25X</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>compileBitcode</key>
              <false/>
          </dict>
          </plist>
          EOF

      # --- BUILD ARCHIVE ---
      - name: Build iOS Archive
        run: |
          xcodebuild -workspace ios/BookrBusinessApp.xcworkspace \
            -scheme BookrBusinessApp \
            -configuration Release \
            -archivePath build/BookrBusinessApp.xcarchive \
            archive \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=3K7597D25X

      # --- EXPORT IPA ---
      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/BookrBusinessApp.xcarchive \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath build

      # --- UPLOAD TO APP STORE CONNECT / TESTFLIGHT ---
      - name: Upload to App Store Connect
        if: ${{ github.event_name == 'push' || github.event.inputs.upload_to_app_store == 'true' }}
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          xcrun altool --upload-app \
            -f build/BookrBusinessApp.ipa \
            -t ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      # --- UPLOAD ARTIFACTS ---
      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-release
          path: build/BookrBusinessApp.ipa
          if-no-files-found: ignore
