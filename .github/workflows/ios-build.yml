name: iOS CI Pipeline

on:
  pull_request:
    branches: [main, develop, release/*]
  push:
    branches: [main, develop]

jobs:
  build-ios:
    name: Code Quality & iOS Build
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10 

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Skia Native Binaries
        run: npx install-skia

      # --- GATE 1: Formatting ---
      - name: Enforce Prettier formatting
        run: pnpm exec prettier --check .

      # --- GATE 2: Linting ---
      - name: Run ESLint
        run: pnpm run lint

      # --- GATE 3: Testing ---
      - name: Run Unit Tests (Jest)
        run: pnpm test

      # --- CACHING & IOS DEPENDENCIES ---
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install CocoaPods
        run: |
          cd ios
          # Prevent 429 CDN Rate Limit Errors by removing the CDN and forcing the Git repo
          sed -i '' "s/source 'https:\/\/cdn.cocoapods.org\/'/source 'https:\/\/github.com\/CocoaPods\/Specs.git'/g" Podfile
          pod install --repo-update

      # --- IOS SIMULATOR DRY-RUN ---
      - name: Build iOS App (Simulator)
        run: |
          xcodebuild -workspace ios/BookrBusinessApp.xcworkspace \
          -scheme BookrBusinessApp \
          -configuration Debug \
          -sdk iphonesimulator \
          -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
          build CODE_SIGNING_ALLOWED=NO
